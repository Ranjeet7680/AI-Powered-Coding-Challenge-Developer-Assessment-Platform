<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Coding Task Factory Architecture &amp; Developer Wiki">
  <defs>
    <linearGradient id="wBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="55%" stop-color="#0D1326" />
      <stop offset="100%" stop-color="#080D1B" />
    </linearGradient>
    <linearGradient id="wLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <pattern id="wGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>
    <style>
      .packet-flow {
        stroke-dasharray: 10 10;
        animation: wDash 1.6s linear infinite;
      }
      .pulse-dot {
        animation: wPulse 2.4s ease-in-out infinite;
      }
      .glow-sweep {
        animation: wSweep 4.8s ease-in-out infinite;
      }
      @keyframes wDash {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes wPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes wSweep {
        0% { transform: translateX(-200px); opacity: 0; }
        20% { opacity: 0.7; }
        80% { opacity: 0.7; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="210" rx="16" fill="url(#wBg)" />
  <rect width="1200" height="210" rx="16" fill="url(#wGrid)" />
  <rect x="6" y="6" width="1188" height="198" rx="13" fill="none" stroke="url(#wLine)" stroke-width="1.2" stroke-opacity="0.45" />
  <rect x="0" y="196" width="180" height="2" fill="url(#wLine)" class="glow-sweep" />

  <!-- Title Section -->
  <text x="48" y="54" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="3">TECHNICAL WIKI  •  SYSTEM DIAGRAMS &amp; ARCHITECTURE</text>
  <text x="48" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800">Coding Task Factory Documentation Hub</text>
  <text x="48" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">End-to-end blueprint: React 19 IDE, Zero-Trust FastAPI, 368+ Challenge Bank, TaskForge Harbor 0.25 &amp; PDF Credentials</text>

  <!-- Animated Mini Pipeline Flow -->
  <g transform="translate(48, 140)" font-family="ui-monospace, monospace" font-size="11" font-weight="700">
    <rect x="0" y="0" width="176" height="36" rx="10" fill="#131B36" stroke="#6366F1" stroke-width="1.2" />
    <circle cx="18" cy="18" r="4" fill="#818CF8" class="pulse-dot" />
    <text x="32" y="22" fill="#E0E7FF">React 19 + Monaco</text>

    <line x1="178" y1="18" x2="236" y2="18" stroke="#38BDF8" stroke-width="1.8" class="packet-flow" />

    <rect x="238" y="0" width="176" height="36" rx="10" fill="#0F242B" stroke="#06B6D4" stroke-width="1.2" />
    <circle cx="256" cy="18" r="4" fill="#22D3EE" class="pulse-dot" />
    <text x="270" y="22" fill="#CFFAFE">FastAPI + JWT Auth</text>

    <line x1="416" y1="18" x2="474" y2="18" stroke="#34D399" stroke-width="1.8" class="packet-flow" />

    <rect x="476" y="0" width="194" height="36" rx="10" fill="#0D261F" stroke="#10B981" stroke-width="1.2" />
    <circle cx="494" cy="18" r="4" fill="#34D399" class="pulse-dot" />
    <text x="508" y="22" fill="#D1FAE5">368+ Bank &amp; Sandbox</text>

    <line x1="672" y1="18" x2="730" y2="18" stroke="#FBBF24" stroke-width="1.8" class="packet-flow" />

    <rect x="732" y="0" width="184" height="36" rx="10" fill="#261D0E" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="750" cy="18" r="4" fill="#FBBF24" class="pulse-dot" />
    <text x="764" y="22" fill="#FEF3C7">PDF + Social Share</text>

    <line x1="918" y1="18" x2="972" y2="18" stroke="#A78BFA" stroke-width="1.8" class="packet-flow" />

    <rect x="974" y="0" width="130" height="36" rx="10" fill="#1E1633" stroke="#8B5CF6" stroke-width="1.2" />
    <circle cx="992" cy="18" r="4" fill="#C4B5FD" class="pulse-dot" />
    <text x="1006" y="22" fill="#EDE9FE">Harbor 0.25</text>
  </g>
</svg>
