  <text x="792" y="169" fill="#a1a1a6" font-size="10.5">• Line-ending &amp; token comparison</text>
  <text x="792" y="186" fill="#a1a1a6" font-size="10.5">• Anti-repeat-solve point farming guard</text>
  <text x="792" y="203" fill="#e5a00d" font-size="10.5">• Runtime ms + memory telemetry</text>

  <rect x="778" y="230" width="296" height="92" rx="8" fill="#222225" stroke="#e5a00d" stroke-opacity="0.45" stroke-width="1" />
  <text x="792" y="252" fill="#ededed" font-size="12.5" font-weight="600">AI Copilot &amp; Big-O Review</text>
  <text x="792" y="271" fill="#a1a1a6" font-size="10.5">• Context-aware debugging hints</text>
  <text x="792" y="288" fill="#a1a1a6" font-size="10.5">• Gemini LLM + Static AST Inspector</text>
  <text x="792" y="305" fill="#e5a00d" font-size="10.5">• Time / Space complexity breakdown</text>

  <rect x="778" y="338" width="296" height="134" rx="8" fill="#141415" stroke="#2c2c31" stroke-width="1" />
  <text x="792" y="360" fill="#4cc38a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500">IDE OUTPUT CONSOLE WIREFRAME</text>
  <text x="792" y="382" fill="#4cc38a" font-family="ui-monospace, monospace" font-size="10.5">Status: Accepted · 4/4 Passed (18ms)</text>
  <text x="792" y="401" fill="#a1a1a6" font-family="ui-monospace, monospace" font-size="10.5">Lang: cpp (g++ C++20 + JsonCpp)</text>
  <text x="792" y="418" fill="#a1a1a6" font-family="ui-monospace, monospace" font-size="10.5">AI Review: O(1) lookup, clean style</text>
