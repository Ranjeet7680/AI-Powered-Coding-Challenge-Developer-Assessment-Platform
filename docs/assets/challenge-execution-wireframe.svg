<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-label="Challenge Bank Synthesis, Multi-Language Execution Sandbox with C++20 JsonCpp, and IDE Wireframe">
