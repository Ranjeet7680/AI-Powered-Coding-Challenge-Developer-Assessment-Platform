  <text x="424" y="168" fill="#85858b" font-family="ui-monospace, monospace" font-size="10.5">sys.executable · stdin JSON · time limit</text>

  <rect x="410" y="198" width="304" height="58" rx="8" fill="#222225" stroke="#35353b" stroke-width="1" />
  <text x="424" y="220" fill="#ededed" font-size="12" font-weight="600">Node JS (.mjs) &amp; TS Strip-Types</text>
  <text x="424" y="238" fill="#85858b" font-family="ui-monospace, monospace" font-size="10.5">node --experimental-strip-types (.mts)</text>

  <rect x="410" y="268" width="304" height="106" rx="8" fill="#222225" stroke="#4cc38a" stroke-opacity="0.45" stroke-width="1.2" />
  <text x="424" y="290" fill="#ededed" font-size="12" font-weight="600">C++20 Compiler + JsonCpp</text>
  <text x="424" y="309" fill="#4cc38a" font-family="ui-monospace, monospace" font-size="10.5">g++ / clang++ -std=c++20 -O2 (-static)</text>
  <text x="424" y="327" fill="#a1a1a6" font-size="10.5">• Auto-detects #include &lt;json/json.h&gt;</text>
  <text x="424" y="344" fill="#a1a1a6" font-size="10.5">• Links vendored open-source-parsers/jsoncpp</text>
  <text x="424" y="361" fill="#ededed" font-size="10.5">• Runs isolated binary per test vector</text>

  <rect x="410" y="388" width="304" height="84" rx="8" fill="#141415" stroke="#2c2c31" stroke-width="1" />
  <text x="424" y="409" fill="#e5a00d" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500">CAPABILITY &amp; HEALTH REPORTING</text>
  <text x="424" y="429" fill="#a1a1a6" font-family="ui-monospace, monospace" font-size="10.5">GET /api/health -&gt; runtimes:</text>
  <text x="424" y="447" fill="#4cc38a" font-family="ui-monospace, monospace" font-size="10.5">{ python, javascript, typescript, cpp }</text>
  <text x="424" y="463" fill="#85858b" font-size="10">Clean Compilation Error JSON on stderr</text>

  <path d="M 732 290 L 754 290" stroke="#4cc38a" stroke-width="2" markerEnd="url(#cbArrG)" />

  <!-- Panel 3: Evaluation, Copilot & Submissions -->
  <rect x="760" y="88" width="332" height="404" rx="12" fill="#19191b" stroke="#2c2c31" stroke-width="1.5" />
