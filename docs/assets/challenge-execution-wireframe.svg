  <rect x="4" y="4" width="1112" height="512" rx="14" fill="none" stroke="#2c2c31" stroke-width="1.4" />

  <text x="32" y="38" fill="#e5a00d" font-family="ui-monospace, monospace" font-size="11" font-weight="500">CHALLENGE BANK (368+) &amp; MULTI-LANGUAGE SANDBOX ARCHITECTURE</text>
  <text x="32" y="64" fill="#ededed" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">Archetype Synthesis, C++20 JsonCpp Compiler Runner, AI Copilot &amp; IDE Wireframe</text>

  <!-- Panel 1: Challenge Bank Synthesis -->
  <rect x="28" y="88" width="336" height="404" rx="12" fill="#19191b" stroke="#2c2c31" stroke-width="1.5" />
  <text x="46" y="112" fill="#ededed" font-family="ui-monospace, monospace" font-size="11" font-weight="500">1 · CHALLENGE BANK SYNTHESIS</text>

  <rect x="46" y="128" width="300" height="86" rx="8" fill="#222225" stroke="#35353b" stroke-width="1" />
  <text x="60" y="150" fill="#ededed" font-size="12.5" font-weight="600">Deterministic Archetypes (360)</text>
  <text x="60" y="169" fill="#a1a1a6" font-size="10.5">• challenge_bank.py (10 domains × 36)</text>
  <text x="60" y="186" fill="#a1a1a6" font-size="10.5">• Verified via Python reference solvers</text>
  <text x="60" y="203" fill="#e5a00d" font-size="10.5">• + 8 curated flagship problems = 368</text>

  <rect x="46" y="230" width="300" height="92" rx="8" fill="#222225" stroke="#35353b" stroke-width="1" />
  <text x="60" y="252" fill="#ededed" font-size="12.5" font-weight="600">On-Demand AI Challenge Engine</text>
  <text x="60" y="271" fill="#a1a1a6" font-size="10.5">• POST /api/generate-challenge</text>
  <text x="60" y="288" fill="#a1a1a6" font-size="10.5">• Gemini LLM + Procedural AST Fallback</text>
  <text x="60" y="305" fill="#4cc38a" font-size="10.5">• Emits PY / JS / TS / C++ templates</text>

  <rect x="46" y="338" width="300" height="134" rx="8" fill="#141415" stroke="#2c2c31" stroke-width="1" />
  <text x="60" y="360" fill="#e5a00d" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500">IDE TASK WIREFRAME PREVIEW</text>
  <text x="60" y="382" fill="#ededed" font-family="ui-monospace, monospace" font-size="10.5">Filter: [All Domains] [Medium]</text>
  <text x="60" y="401" fill="#85858b" font-family="ui-monospace, monospace" font-size="10.5">- ctf-001 Subarray Prefix Sum</text>
  <text x="60" y="418" fill="#85858b" font-family="ui-monospace, monospace" font-size="10.5">- c2-lru-cache LRU Eviction</text>
  <text x="60" y="435" fill="#a1a1a6" font-family="ui-monospace, monospace" font-size="10.5">- ML Cosine Similarity Vector</text>
  <text x="60" y="454" fill="#4cc38a" font-family="ui-monospace, monospace" font-size="10.5">Starter + Constraints + Test Cases</text>

  <path d="M 364 290 L 386 290" stroke="#e5a00d" stroke-width="2" markerEnd="url(#cbArr)" />

  <!-- Panel 2: Multi-Language Execution Sandbox -->
  <rect x="392" y="88" width="340" height="404" rx="12" fill="#19191b" stroke="#2c2c31" stroke-width="1.5" />
