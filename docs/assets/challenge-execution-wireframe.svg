<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-label="Challenge Bank Synthesis, Multi-Language Execution Sandbox with C++20 JsonCpp, and IDE Wireframe">
  <defs>
    <pattern id="cbGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#222225" stroke-width="0.6" />
    </pattern>
    <marker id="cbArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e5a00d" />
