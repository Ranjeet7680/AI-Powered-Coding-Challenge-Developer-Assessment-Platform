<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Coding Task Factory — AI-Powered Coding Challenge &amp; Developer Assessment Platform">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#0B1124" />
      <stop offset="100%" stop-color="#070B19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0" />
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#A78BFA" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="orbLeft" cx="18%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbRight" cx="84%" cy="72%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
    <style>
      .pulse-orb {
        animation: orbPulse 6s ease-in-out infinite;
        transform-origin: center;
      }
      .float-slow {
        animation: floatSlow 5.5s ease-in-out infinite;
      }
      .float-delayed {
        animation: floatSlow 5.5s ease-in-out 1.4s infinite;
      }
      .flow-dash {
        stroke-dasharray: 12 10;
        animation: dashMove 1.8s linear infinite;
      }
      .flow-dash-slow {
        stroke-dasharray: 8 14;
        animation: dashMove 3.2s linear infinite;
      }
      .scan-beam {
        animation: beamSweep 5s ease-in-out infinite;
      }
      .cursor-blink {
        animation: blink 1.1s steps(2, start) infinite;
      }
      .ring-spin {
        animation: spinSlow 24s linear infinite;
        transform-origin: 1030px 158px;
      }
      .node-ping {
        animation: nodePing 3s ease-in-out infinite;
      }
      @keyframes orbPulse {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes dashMove {
        from { stroke-dashoffset: 44; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes beamSweep {
        0% { transform: translateX(-280px); opacity: 0; }
        15% { opacity: 0.55; }
        85% { opacity: 0.55; }
        100% { transform: translateX(1260px); opacity: 0; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes nodePing {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#gridPattern)" />
  <rect width="1200" height="320" rx="18" fill="url(#orbLeft)" class="pulse-orb" />
  <rect width="1200" height="320" rx="18" fill="url(#orbRight)" class="pulse-orb" />

  <!-- Outer Precision Frame -->
  <rect x="8" y="8" width="1184" height="304" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- Animated Top Signal Line -->
  <line x1="28" y1="28" x2="1172" y2="28" stroke="#1E293B" stroke-width="1" />
  <rect x="0" y="27" width="220" height="2" fill="url(#streamGrad)" class="scan-beam" />

  <!-- Animated Neural / Pipeline Trace Lines -->
  <path d="M 110 250 C 260 250, 320 278, 520 278 S 820 245, 960 212" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 110 250 C 260 250, 320 278, 520 278 S 820 245, 960 212" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.65" class="flow-dash" />
  <path d="M 790 64 C 875 64, 915 110, 975 135" fill="none" stroke="#818CF8" stroke-width="1.3" stroke-opacity="0.6" class="flow-dash-slow" />

  <!-- Left Code Emblem Card -->
  <g class="float-slow">
    <rect x="52" y="68" width="76" height="76" rx="18" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2" />
    <rect x="60" y="76" width="60" height="60" rx="13" fill="#131D38" />
    <text x="90" y="114" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Main Title Block -->
  <text x="150" y="76" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="3.5">INNOVATION AI HACKATHON  •  TASKFORGE &amp; ASSESSMENT CLOUD</text>

  <text x="150" y="118" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.6">Coding Task Factory</text>

  <text x="150" y="149" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">AI-Powered Coding Challenges, Zero-Trust Execution &amp; Verified Credentials</text>

  <!-- Animated Terminal Sub-prompt -->
  <g transform="translate(150, 168)">
    <rect x="0" y="0" width="650" height="34" rx="9" fill="#070B16" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="16" cy="17" r="4" fill="#10B981" class="node-ping" />
    <text x="30" y="21.5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      $ ctf --bank=368+ --langs=py,js,ts,cpp --harbor=0.25 --cert=pdf+sha256
    </text>
    <rect x="576" y="10" width="8" height="15" rx="1.5" fill="#38BDF8" class="cursor-blink" />
  </g>

  <!-- Animated Feature Pill Badges -->
  <g transform="translate(150, 222)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
    <rect x="0" y="0" width="152" height="32" rx="16" fill="#131B36" stroke="#4F46E5" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4" fill="#818CF8" />
    <text x="30" y="20" fill="#E0E7FF">368+ Challenges</text>

    <rect x="164" y="0" width="156" height="32" rx="16" fill="#0F242B" stroke="#06B6D4" stroke-width="1.2" />
    <circle cx="182" cy="16" r="4" fill="#22D3EE" />
    <text x="194" y="20" fill="#CFFAFE">4-Lang Sandbox</text>

    <rect x="332" y="0" width="166" height="32" rx="16" fill="#0D261F" stroke="#10B981" stroke-width="1.2" />
    <circle cx="350" cy="16" r="4" fill="#34D399" />
    <text x="362" y="20" fill="#D1FAE5">100% Mutation Kill</text>

    <rect x="510" y="0" width="192" height="32" rx="16" fill="#261D0E" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="528" cy="16" r="4" fill="#FBBF24" />
    <text x="540" y="20" fill="#FEF3C7">PDF + Social Share</text>
  </g>

  <!-- Right Orbital Credential & Execution Hub Graphic -->
  <g>
    <circle cx="1030" cy="158" r="88" fill="none" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="1030" cy="158" r="88" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" stroke-dasharray="14 12" class="ring-spin" />
    <circle cx="1030" cy="158" r="64" fill="#0B1226" stroke="#334155" stroke-width="1.2" />

    <!-- Orbital Nodes -->
    <g class="float-delayed">
      <circle cx="945" cy="126" r="14" fill="#131B36" stroke="#6366F1" stroke-width="1.5" />
      <text x="945" y="130" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PY</text>

      <circle cx="1115" cy="126" r="14" fill="#10252C" stroke="#06B6D4" stroke-width="1.5" />
      <text x="1115" y="130" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="10" font-weight="700">TS</text>

      <circle cx="956" cy="212" r="14" fill="#0D261F" stroke="#10B981" stroke-width="1.5" />
      <text x="956" y="216" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">AI</text>

      <circle cx="1104" cy="212" r="14" fill="#291E0F" stroke="#F59E0B" stroke-width="1.5" />
      <text x="1104" y="216" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, monospace" font-size="9" font-weight="700">PDF</text>
    </g>

    <!-- Center Seal -->
    <polygon points="1030,116 1058,132 1058,168 1030,188 1002,168 1002,132" fill="#111936" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="1030" y="149" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, monospace" font-size="11" font-weight="800">SHA-256</text>
    <text x="1030" y="165" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">VERIFIED</text>
    <text x="1030" y="206" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5">HARBOR 0.25</text>
  </g>
</svg>
