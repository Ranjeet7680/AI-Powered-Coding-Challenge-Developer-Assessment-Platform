<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Coding Task Factory — AI-Powered Coding Challenge &amp; Developer Assessment Platform">
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222225" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Graphite Canvas -->
  <rect width="1200" height="320" rx="16" fill="#141415" />
  <rect width="1200" height="320" rx="16" fill="url(#gridPattern)" opacity="0.65" />
  <rect x="8" y="8" width="1184" height="304" rx="12" fill="#19191b" fill-opacity="0.72" stroke="#2c2c31" stroke-width="1.2" />

  <!-- Subtle Right ASCII Code Matrix Texture -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ededed" opacity="0.08">
    <text x="820" y="54">. : / { } &lt; &gt; = # . : / { } &lt; &gt;</text>
    <text x="836" y="76">{ } = # . : / [ ] ( ) &lt; &gt; = # .</text>
    <text x="812" y="98">/ &lt; &gt; { } . : # = / &lt; &gt; { } . :</text>
    <text x="844" y="250">: # = / &lt; &gt; { } . : # = / &lt; &gt; {</text>
    <text x="820" y="272">. { } / &lt; &gt; = # . : / { } &lt; &gt; =</text>
  </g>

  <!-- Left Drafted Emblem Frame -->
  <g transform="translate(52, 64)">
    <rect x="0" y="0" width="76" height="76" rx="14" fill="#19191b" stroke="#35353b" stroke-width="1.5" />
    <path d="M30 26 L18 38 L30 50" stroke="#ededed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M46 26 L58 38 L46 50" stroke="#ededed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M43 22 L33 54" stroke="#e5a00d" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Title Block -->
  <text x="150" y="74" fill="#e5a00d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">INNODATA AI HACKATHON · TASKFORGE &amp; ASSESSMENT WORKBENCH</text>

  <text x="150" y="116" fill="#ededed" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.6">Coding Task Factory</text>

  <text x="150" y="148" fill="#a1a1a6" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">368+ Multi-Language Challenges, ML/DL Academies, Proctored Exams &amp; Verified PDF Credentials</text>

  <!-- Command Line Strip -->
  <g transform="translate(150, 170)">
    <rect x="0" y="0" width="668" height="34" rx="8" fill="#0f0f10" stroke="#2c2c31" stroke-width="1.2" />
    <circle cx="16" cy="17" r="4" fill="#4cc38a" />
    <text x="30" y="21.5" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">$ ctf --bank=368+ --lms=127 --langs=py,js,ts,cpp --harbor=0.25 --cert=pdf+sha256</text>
  </g>

  <!-- Feature Chips -->
  <g transform="translate(150, 224)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    <rect x="0" y="0" width="146" height="32" rx="8" fill="#222225" stroke="#35353b" stroke-width="1.2" />
    <circle cx="16" cy="16" r="3.5" fill="#e5a00d" />
    <text x="28" y="20" fill="#ededed">368+ Challenges</text>

    <rect x="158" y="0" width="146" height="32" rx="8" fill="#222225" stroke="#35353b" stroke-width="1.2" />
    <circle cx="174" cy="16" r="3.5" fill="#a1a1a6" />
    <text x="186" y="20" fill="#ededed">127 LMS Lectures</text>

    <rect x="316" y="0" width="148" height="32" rx="8" fill="#222225" stroke="#35353b" stroke-width="1.2" />
    <circle cx="332" cy="16" r="3.5" fill="#4cc38a" />
    <text x="344" y="20" fill="#ededed">4-Lang Sandbox</text>

    <rect x="476" y="0" width="192" height="32" rx="8" fill="#222225" stroke="#35353b" stroke-width="1.2" />
    <circle cx="492" cy="16" r="3.5" fill="#e5a00d" />
    <text x="504" y="20" fill="#ededed">Harbor 0.25 · 100% Kill</text>
  </g>

  <!-- Right Precision Verification Card -->
  <g transform="translate(920, 44)">
    <rect x="0" y="0" width="232" height="232" rx="14" fill="#141415" stroke="#2c2c31" stroke-width="1.5" />
    <text x="22" y="34" fill="#85858b" font-family="ui-monospace, monospace" font-size="11" font-weight="500">RUNTIME VERIFICATION</text>
    <line x1="22" y1="48" x2="210" y2="48" stroke="#222225" stroke-width="1" />

    <text x="22" y="76" fill="#a1a1a6" font-family="ui-monospace, monospace" font-size="12">PY · JS · TS · C++20</text>
    <text x="22" y="102" fill="#4cc38a" font-family="ui-monospace, monospace" font-size="12">oracle reward = 1.0</text>
    <text x="22" y="126" fill="#ededed" font-family="ui-monospace, monospace" font-size="12">nop baseline  = 0.0</text>
    <text x="22" y="150" fill="#e5a00d" font-family="ui-monospace, monospace" font-size="12">mutants       = 10/10</text>

    <line x1="22" y1="168" x2="210" y2="168" stroke="#222225" stroke-width="1" />
    <rect x="22" y="182" width="188" height="30" rx="6" fill="#19191b" stroke="#35353b" stroke-width="1" />
    <text x="116" y="201" text-anchor="middle" fill="#ededed" font-family="ui-monospace, monospace" font-size="11" font-weight="500">SHA-256 + ReportLab PDF</text>
  </g>
</svg>
