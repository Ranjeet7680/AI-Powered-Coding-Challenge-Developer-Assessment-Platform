  <text x="32" y="66" fill="#ededed" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600">106-Lecture ML LMS + MediaPipe AI Camera Guard + Certification Architecture</text>

