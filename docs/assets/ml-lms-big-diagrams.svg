  <text x="912" y="430" fill="#CBD5E1" font-size="11">• Deep Nets &amp; Backpropagation</text>
  <text x="912" y="450" fill="#CBD5E1" font-size="11">• Reinforcement Learning &amp; MDPs</text>
  <text x="912" y="476" fill="#67E8F9" font-size="11">• 8 Multi-Playlist Video Theater</text>
