  <text x="644" y="592" fill="#FFFFFF" font-size="12" font-weight="700">api.courseLms(&apos;ml&apos; | &apos;dl&apos;) → /api/ml-course/* &amp; /api/dl-course/*</text>
  <text x="644" y="616" fill="#D1FAE5" font-size="11">• Tracks watched lectures, per-lecture quiz scores, &amp; XP points (+15 XP/lecture)</text>
