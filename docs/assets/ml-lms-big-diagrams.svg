  <!-- BIG DIAGRAM 2: AI CAMERA PROCTOR & ANTI-CHEAT -->
  <rect x="28" y="302" width="562" height="430" rx="12" fill="#19191b" stroke="#e5484d" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="46" y="326" fill="#e5484d" font-family="ui-monospace, monospace" font-size="11.5" font-weight="500">DIAGRAM 2 · MEDIAPIPE AI CAMERA PROCTOR &amp; ANTI-CHEAT PIPELINE</text>

  <rect x="46" y="344" width="526" height="66" rx="8" fill="#222225" stroke="#35353b" stroke-width="1.1" />
  <text x="62" y="366" fill="#ededed" font-size="13" font-weight="600">1. Live Webcam Frame Capture (640×360 canvas + Browser Hooks)</text>
  <text x="62" y="388" fill="#a1a1a6" font-size="11">Captures luminance, YCbCr skin ratio, inter-frame motion &amp; tab/fullscreen/DevTools events</text>

  <path d="M 309 410 L 309 428" stroke="#e5484d" stroke-width="1.8" markerEnd="url(#mlArrR)" />

  <rect x="46" y="432" width="526" height="122" rx="8" fill="#141415" stroke="#35353b" stroke-width="1.1" />
  <text x="62" y="454" fill="#e5a00d" font-family="ui-monospace, monospace" font-size="11" font-weight="500">2. 4-TIER VISION DETECTOR CASCADE (proctorVision.ts)</text>
  <text x="62" y="476" fill="#ededed" font-size="11.5">• Tier 1 (mediapipe-full): BlazeFace FaceDetector + COCO ObjectDetector (/proctor/)</text>
  <text x="62" y="496" fill="#a1a1a6" font-size="11.5">• Tier 2 (mediapipe-face): Self-hosted BlazeFace face &amp; yaw-gaze keypoints</text>
  <text x="62" y="516" fill="#a1a1a6" font-size="11.5">• Tier 3 (browser-face): Native window.FaceDetector Shape API</text>
  <text x="62" y="536" fill="#85858b" font-size="11.5">• Tier 4 (skin-cv): YCbCr lens obstruction &amp; frozen-frame heuristic fallback</text>

  <path d="M 309 554 L 309 572" stroke="#e5484d" stroke-width="1.8" markerEnd="url(#mlArrR)" />

  <rect x="46" y="576" width="526" height="136" rx="8" fill="#222225" stroke="#e5484d" stroke-opacity="0.45" stroke-width="1.2" />
  <text x="62" y="598" fill="#e5484d" font-family="ui-monospace, monospace" font-size="11" font-weight="500">3. REAL-TIME VIOLATION SIGNALS &amp; 3-STRIKE ENFORCEMENT</text>
  <text x="62" y="620" fill="#ededed" font-size="11.5">• Prohibited Objects: cell phone · mobile phone · book · laptop · remote · tv</text>
  <text x="62" y="640" fill="#ededed" font-size="11.5">• Presence &amp; Integrity: 0 faces · &gt;1 faces · gazeAway · lens covered · frozen frame</text>
  <text x="62" y="660" fill="#e5a00d" font-size="11.5">• Browser Lock: copy/paste block · right-click block · tab blur · fullscreen exit</text>
  <text x="62" y="688" fill="#4cc38a" font-size="11.5" font-weight="600">Result: HUD Bounding Boxes + Audio Beep + 0/3 -&gt; 3/3 Strike Log -&gt; Auto-Lock Exam</text>

