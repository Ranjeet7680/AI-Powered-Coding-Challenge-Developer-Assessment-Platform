  <text x="642" y="445" fill="#a1a1a6" font-size="11">M4: Naive Bayes &amp; Trees (44–54)</text>
  <text x="642" y="464" fill="#a1a1a6" font-size="11">M5: Boosting &amp; Ensembles (55–75)</text>
  <text x="642" y="483" fill="#a1a1a6" font-size="11">M6: Neural Nets &amp; CNNs (76–90)</text>
  <text x="642" y="502" fill="#ededed" font-size="11">M7: Transformers, PyTorch &amp; RL (91–106)</text>

  <rect x="898" y="344" width="256" height="174" rx="8" fill="#141415" stroke="#35353b" stroke-width="1.1" />
  <text x="912" y="366" fill="#e5a00d" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500">STANFORD × CTF DL (21) &amp; HUB</text>
  <text x="912" y="390" fill="#ededed" font-size="11">• CS229 Linear &amp; Logistic Reg</text>
  <text x="912" y="410" fill="#a1a1a6" font-size="11">• Kernels, SVM &amp; Learning Theory</text>
  <text x="912" y="430" fill="#a1a1a6" font-size="11">• Deep Nets &amp; Backpropagation</text>
  <text x="912" y="450" fill="#a1a1a6" font-size="11">• Reinforcement Learning &amp; MDPs</text>
  <text x="912" y="476" fill="#ededed" font-size="11">• 8 Multi-Playlist Video Theater</text>
  <text x="912" y="498" fill="#4cc38a" font-size="11">• Native In-LMS Stream &amp; Share</text>

  <path d="M 891 518 L 891 542" stroke="#4cc38a" stroke-width="1.8" markerEnd="url(#mlArrG)" />

  <rect x="628" y="546" width="526" height="166" rx="8" fill="#222225" stroke="#4cc38a" stroke-opacity="0.45" stroke-width="1.2" />
  <text x="644" y="568" fill="#4cc38a" font-family="ui-monospace, monospace" font-size="11" font-weight="500">FASTAPI LMS API &amp; CREDENTIAL TELEMETRY STORE</text>
  <text x="644" y="592" fill="#ededed" font-size="12" font-weight="600">api.courseLms(&apos;ml&apos; | &apos;dl&apos;) -&gt; /api/ml-course/* &amp; /api/dl-course/*</text>
  <text x="644" y="616" fill="#a1a1a6" font-size="11">• Tracks watched lectures, per-lecture quiz scores, &amp; XP points (+15 XP/lecture)</text>
  <text x="644" y="638" fill="#a1a1a6" font-size="11">• Persists Capstone submissions, Final Exam violation logs, &amp; course reviews</text>
  <text x="644" y="660" fill="#e5a00d" font-size="11">• Unlocks ReportLab SHA-256 Vector PDF Certificate &amp; Swag/Goodies shipping record</text>
  <text x="644" y="688" fill="#ededed" font-size="11" font-weight="600">Verified on Public Registry (/verify/:id) + LinkedIn / Instagram / Facebook / WhatsApp</text>
