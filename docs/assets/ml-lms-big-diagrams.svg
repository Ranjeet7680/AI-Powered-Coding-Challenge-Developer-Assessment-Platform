  <!-- BIG DIAGRAM 2: AI CAMERA PROCTOR & ANTI-CHEAT -->
  <rect x="28" y="302" width="562" height="430" rx="14" fill="#130B14" stroke="#F43F5E" stroke-width="1.6" />
  <text x="46" y="326" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">DIAGRAM 2 · MEDIAPIPE AI CAMERA PROCTOR &amp; ANTI-CHEAT PIPELINE</text>

  <rect x="46" y="344" width="526" height="66" rx="10" fill="#1F1220" stroke="#FB7185" stroke-width="1.1" />
  <text x="62" y="366" fill="#FFFFFF" font-size="13" fontWeight="700">1. Live Webcam Frame Capture (640×360 canvas + Browser Hooks)</text>
  <text x="62" y="388" fill="#FDA4AF" font-size="11">Captures luminance, YCbCr skin ratio, inter-frame motion &amp; tab/fullscreen/DevTools events</text>

  <path d="M 309 410 L 309 428" stroke="#F43F5E" stroke-width="1.8" markerEnd="url(#mlArrR)" />

  <rect x="46" y="432" width="526" height="122" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.1" />
  <text x="62" y="454" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="11" font-weight="700">2. 4-TIER VISION DETECTOR CASCADE (proctorVision.ts)</text>
  <text x="62" y="476" fill="#FFFFFF" font-size="11.5">• Tier 1 (mediapipe-full): BlazeFace FaceDetector + COCO ObjectDetector (/proctor/)</text>
  <text x="62" y="496" fill="#CBD5E1" font-size="11.5">• Tier 2 (mediapipe-face): Self-hosted BlazeFace face &amp; yaw-gaze keypoints</text>
  <text x="62" y="516" fill="#CBD5E1" font-size="11.5">• Tier 3 (browser-face): Native window.FaceDetector Shape API</text>
  <text x="62" y="536" fill="#94A3B8" font-size="11.5">• Tier 4 (skin-cv): YCbCr lens obstruction &amp; frozen-frame heuristic fallback</text>

  <path d="M 309 554 L 309 572" stroke="#F43F5E" stroke-width="1.8" markerEnd="url(#mlArrR)" />

  <rect x="46" y="576" width="526" height="136" rx="10" fill="#2A0F18" stroke="#F43F5E" stroke-width="1.2" />
  <text x="62" y="598" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">3. REAL-TIME VIOLATION SIGNALS &amp; 3-STRIKE ENFORCEMENT</text>
  <text x="62" y="620" fill="#FFFFFF" font-size="11.5">• Prohibited Objects: cell phone · mobile phone · book · laptop · remote · tv</text>
  <text x="62" y="640" fill="#FFFFFF" font-size="11.5">• Presence &amp; Integrity: 0 faces · &gt;1 faces · gazeAway · lens covered · frozen frame</text>
  <text x="62" y="660" fill="#FDE68A" font-size="11.5">• Browser Lock: copy/paste block · right-click block · tab blur · fullscreen exit</text>
  <text x="62" y="688" fill="#34D399" font-size="11.5" font-weight="700">Result: HUD Bounding Boxes + Audio Beep + 0/3→3/3 Strike Log → Auto-Lock Exam</text>

