    <g stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2.4">
      <line x1="295" y1="95" x2="400" y2="170" />
      <line x1="295" y1="185" x2="400" y2="170" />
      <line x1="295" y1="275" x2="400" y2="170" />
      <line x1="295" y1="95" x2="400" y2="290" />
      <line x1="295" y1="275" x2="400" y2="290" />
      <line x1="295" y1="365" x2="400" y2="290" />
    </g>

    <!-- Input Nodes (Cardinal Rose) -->
    <g fill="#0F172A" stroke="#FB7185" stroke-width="3">
      <circle cx="60" cy="80" r="14" />
      <circle cx="60" cy="180" r="14" />
      <circle cx="60" cy="280" r="14" />
      <circle cx="60" cy="380" r="14" />
    </g>
    <!-- Hidden Layer 1 (Violet) -->
    <g fill="#1E1B4B" stroke="#A78BFA" stroke-width="3">
