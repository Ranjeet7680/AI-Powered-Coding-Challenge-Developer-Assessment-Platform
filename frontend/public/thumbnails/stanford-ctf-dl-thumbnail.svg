    <circle cx="220" cy="230" r="195" fill="#1E1B4B" fill-opacity="0.38" stroke="url(#dlStroke)" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Synaptic Edges Layer 1 -> Layer 2 -->
    <g stroke="#E11D48" stroke-opacity="0.45" stroke-width="2">
      <line x1="60" y1="80" x2="175" y2="55" />
      <line x1="60" y1="80" x2="175" y2="145" />
      <line x1="60" y1="80" x2="175" y2="235" />
      <line x1="60" y1="180" x2="175" y2="55" />
      <line x1="60" y1="180" x2="175" y2="145" />
      <line x1="60" y1="180" x2="175" y2="235" />
      <line x1="60" y1="180" x2="175" y2="325" />
      <line x1="60" y1="280" x2="175" y2="145" />
      <line x1="60" y1="280" x2="175" y2="235" />
      <line x1="60" y1="280" x2="175" y2="325" />
      <line x1="60" y1="280" x2="175" y2="415" />
      <line x1="60" y1="380" x2="175" y2="235" />
      <line x1="60" y1="380" x2="175" y2="325" />
      <line x1="60" y1="380" x2="175" y2="415" />
