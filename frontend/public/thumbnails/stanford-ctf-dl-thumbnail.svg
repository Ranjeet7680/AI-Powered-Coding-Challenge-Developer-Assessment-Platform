<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="dlBg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="48%" stop-color="#130916" />
      <stop offset="100%" stop-color="#081226" />
    </linearGradient>
    <radialGradient id="stanfordGlow" cx="0.18" cy="0.24" r="0.6">
      <stop offset="0%" stop-color="#B1040E" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#B1040E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ctfGlow" cx="0.82" cy="0.72" r="0.65">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dlStroke" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="titleAccent" x1="0" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas + Dual Brand Radial Auras -->
  <rect width="1280" height="720" fill="url(#dlBg)" />
  <rect width="1280" height="720" fill="url(#stanfordGlow)" />
  <rect width="1280" height="720" fill="url(#ctfGlow)" />

  <!-- Subtle Technical Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280" />
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720" />
  </g>

  <!-- Outer Precision Frame -->
  <rect x="28" y="28" width="1224" height="664" rx="30" fill="#070B16" fill-opacity="0.72" stroke="url(#dlStroke)" stroke-width="2.5" stroke-opacity="0.75" />

  <!-- Right-Side Illuminated Deep Neural Network Architecture Artwork -->
  <g transform="translate(765, 118)" opacity="0.95">
