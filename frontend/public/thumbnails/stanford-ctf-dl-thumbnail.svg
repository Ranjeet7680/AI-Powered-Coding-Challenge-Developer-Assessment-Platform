      <line x1="175" y1="55" x2="295" y2="185" />
      <line x1="175" y1="145" x2="295" y2="95" />
      <line x1="175" y1="145" x2="295" y2="185" />
      <line x1="175" y1="145" x2="295" y2="275" />
      <line x1="175" y1="235" x2="295" y2="185" />
      <line x1="175" y1="235" x2="295" y2="275" />
      <line x1="175" y1="235" x2="295" y2="365" />
      <line x1="175" y1="325" x2="295" y2="185" />
      <line x1="175" y1="325" x2="295" y2="275" />
      <line x1="175" y1="325" x2="295" y2="365" />
      <line x1="175" y1="415" x2="295" y2="275" />
      <line x1="175" y1="415" x2="295" y2="365" />
