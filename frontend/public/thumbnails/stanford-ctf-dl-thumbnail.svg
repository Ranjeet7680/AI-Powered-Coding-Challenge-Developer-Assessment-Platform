    <g fill="#172554" stroke="#818CF8" stroke-width="3">
      <circle cx="295" cy="95" r="15" />
      <circle cx="295" cy="185" r="15" />
      <circle cx="295" cy="275" r="15" />
      <circle cx="295" cy="365" r="15" />
    </g>
    <!-- Output Nodes (Cyan) -->
    <g fill="#083344" stroke="#22D3EE" stroke-width="3.5">
      <circle cx="400" cy="170" r="18" />
      <circle cx="400" cy="290" r="18" />
    </g>

    <!-- Floating Formula Tag -->
    <rect x="75" y="454" width="300" height="42" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5" />
    <text x="225" y="481" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="16" font-weight="700">∇θ J(θ) = -α Σ ∂L / ∂W[l]</text>
  </g>

  <!-- Co-Brand Top Partnership Pill -->
  <g transform="translate(74, 78)">
    <rect x="0" y="0" width="568" height="46" rx="23" fill="#1F0B14" stroke="#E11D48" stroke-width="1.8" stroke-opacity="0.8" />
    <circle cx="26" cy="23" r="8" fill="#F43F5E" />
    <text x="48" y="29" fill="#FECDD3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" letter-spacing="1.5">STANFORD  ×  CODING TASK FACTORY ACADEMY</text>
  </g>

  <!-- CTF Hex Emblem + Stanford CS229 Heritage Label -->
  <g transform="translate(74, 156)">
    <rect x="0" y="0" width="84" height="84" rx="20" fill="#0F172A" stroke="url(#dlStroke)" stroke-width="2.5" />
    <polygon points="42,12 68,27 68,57 42,72 16,57 16,27" fill="#17203B" stroke="#818CF8" stroke-width="1.8" />
    <path d="M33 32 L22 42 L33 52" stroke="#FDA4AF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M51 32 L62 42 L51 52" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="42,26 48,42 42,58 36,42" fill="#38BDF8" />
    <text x="106" y="34" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="2">CS229 DEEP LEARNING &amp; AI TRACK</text>
    <text x="106" y="64" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Andrew Ng Lecture Series · Curated Engineering LMS</text>
  </g>

  <!-- Main Course Headline -->
  <text x="74" y="328" fill="url(#titleAccent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Deep Learning</text>
  <text x="74" y="400" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" letter-spacing="-1">&amp; Neural Mastery</text>

  <!-- Subtitle -->
  <text x="74" y="458" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500">From Gradient Descent &amp; Kernels to Backpropagation, EM, PCA &amp; Deep RL</text>

  <!-- Feature Badges Strip -->
  <g transform="translate(74, 512)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">
    <rect x="0" y="0" width="160" height="58" rx="16" fill="#2A0F18" stroke="#E11D48" stroke-width="1.8" />
    <text x="80" y="36" text-anchor="middle" fill="#FECDD3">21 Lectures</text>

    <rect x="176" y="0" width="166" height="58" rx="16" fill="#171B3A" stroke="#6366F1" stroke-width="1.8" />
    <text x="259" y="36" text-anchor="middle" fill="#E0E7FF">20+ Quizzes</text>

    <rect x="358" y="0" width="164" height="58" rx="16" fill="#0B2732" stroke="#06B6D4" stroke-width="1.8" />
    <text x="440" y="36" text-anchor="middle" fill="#CFFAFE">Notes &amp; Code</text>

    <rect x="538" y="0" width="214" height="58" rx="16" fill="#0B291E" stroke="#10B981" stroke-width="1.8" />
    <text x="645" y="36" text-anchor="middle" fill="#D1FAE5">Cam Proctored</text>
  </g>

  <!-- Bottom Verified Certificate Seal Note -->
  <g transform="translate(74, 622)">
    <rect x="0" y="-22" width="10" height="28" rx="5" fill="#10B981" />
    <text x="24" y="0" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="17" font-weight="600">INCLUDES AI CAMERA ANTI-CHEAT FINAL EXAM  •  SHA-256 VERIFIED CERTIFICATE &amp; A4 VECTOR PDF</text>
  </g>
