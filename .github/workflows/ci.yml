name: CI & Harbor Benchmark Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Typecheck, Build & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Frontend Lint, Types & Build
        run: |
          cd frontend
          npm install
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Install Backend Dependencies & Test Runner
        run: |
          cd backend
          pip install -r requirements.txt pytest httpx httpx2

      - name: Run Backend API, Sandbox & Certificate PDF Tests
        run: |
          python -m pytest backend/tests/test_api.py -v

      - name: Verify Zero-Trust Security Suite
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'backend')
          from app.routers.auth import validate_strong_password, hash_pw, verify_pw, create_jwt_token, decode_jwt_token
          validate_strong_password('Unhackable#Pass2026!')
          hashed = hash_pw('Unhackable#Pass2026!')
          assert verify_pw('Unhackable#Pass2026!', hashed)
          assert not verify_pw('WrongPassword123!', hashed)
          token = create_jwt_token('test-user', 'test@example.com', 'developer')
          payload = decode_jwt_token(token)
          assert payload['sub'] == 'test-user'
          assert payload['email'] == 'test@example.com'
          print('Zero-Trust Security Unit Tests: 100% PASSED')
          "
